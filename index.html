<!--
[Claude에게] 이 프로젝트 파일을 수정해서 사용자에게 줄 때는, 답변마다 수정한 파일 각각을 GitHub 저장소의 어느 폴더(경로)에 올려야 하는지 항상 알려주세요. 사용자는 아이패드로 GitHub 웹에서 올려요.

[올릴 위치] 이 파일(index.html)은 GitHub 저장소 맨 바깥(루트)에 올려요.

먼작귀의 작은 여름집 — GitHub 저장소 폴더 구조 (파일은 반드시 이 위치에 올려야 해요)

  (저장소 맨 바깥)  index.html, sw.js, manifest.json, icon-192.png, icon-512.png
  audio/                      소리 파일(.mp3)
  fonts/                      폰트(berry.woff)
  splash/                     아이폰 시작 화면 그림
  img/bg/                     배경 그림
  img/chara/                  캐릭터 그림
  img/signs/                  표지판 그림
  img/ui/                     커튼 등 화면 장식
  img/minigame/fishing/       낚시 그림
  img/minigame/wash/          씻기 그림
  img/minigame/fan/           부채 그림
  img/minigame/dex/           도감 그림
  img/minigame/ingredients/   재료 그림(ing-01~52)

주의: 그림·소리를 새로 추가하면 sw.js 안의 파일 목록(const F=[...])에도 같은 경로를 넣어야 하고,
      목록에 없는 경로가 하나라도 있으면 서비스 워커 설치가 실패해요. 고친 뒤에는 캐시 이름(const C=...)의 번호도 올려 주세요.
-->

<script>
// 시작 화면 이미지를 기기 화면 크기에 맞춰 자동 생성 (iOS 홈 화면 앱이 화면 전체를 쓰게 하는 데 필요)
(function(){try{
  var sw=Math.min(screen.width,screen.height),sh=Math.max(screen.width,screen.height),d=window.devicePixelRatio||1;
  var img=new Image();
  function make(cw,ch,o){
    var c=document.createElement('canvas');c.width=Math.round(cw*d);c.height=Math.round(ch*d);
    var x=c.getContext('2d');x.fillStyle='#f3e6c8';x.fillRect(0,0,c.width,c.height);
    if(img.naturalWidth){var s=Math.min(c.width,c.height)*.38/img.naturalWidth,w=img.naturalWidth*s,hh=img.naturalHeight*s;x.drawImage(img,(c.width-w)/2,(c.height-hh)/2,w,hh)}
    var l=document.createElement('link');l.rel='apple-touch-startup-image';l.href=c.toDataURL('image/png');
    l.media='(device-width:'+sw+'px) and (device-height:'+sh+'px) and (-webkit-device-pixel-ratio:'+d+') and (orientation:'+o+')';
    document.head.appendChild(l);
  }
  function go(){make(sw,sh,'portrait');make(sh,sw,'landscape')}
  img.onload=go;img.onerror=go;img.src='img/chara/chiikawa.webp';
}catch(e){}})();
</script>
<title>먼작귀의 작은 여름집</title>
<style>
:root{--z:1;--room:url(img/bg/room1.webp);--card:rgba(255,250,240,.9);--ink:#5b4636;--pink:#f4a9a8;--blue:#8fb8e8;--green:#a8d08d;--line:rgba(91,70,54,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;background-color:#2a1f16}
@font-face{font-family:"Berry";src:url(fonts/berry.woff) format("woff");font-weight:400 700;font-display:swap}
body{font-family:"Berry","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
/* 핸드폰 전체화면 */
#stage{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#e9d9b5;touch-action:none}
/* 월드 = 방 그림 크기(1536x1024) 그대로. 화면에 맞춰 확대하고 캐릭터를 따라 카메라가 움직여요 */
#world{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;background:var(--room) 0 0/100% 100% no-repeat;will-change:transform}
#bgSet,#bgEve{filter:saturate(1.12) contrast(1.04)}
#bgTw,#bgNt,#bgN2,#bgN3{filter:saturate(1.1) contrast(1.04)}
#stage.noanim,#stage.noanim *{transition:none!important}
#bgPm{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-afternoon.webp) 0 0/100% 100% no-repeat}
#bgSet{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-sunset.webp) 0 0/100% 100% no-repeat}
#bgEve{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-dusk.webp) 0 0/100% 100% no-repeat}
#bgTw{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-twilight.webp) 0 0/100% 100% no-repeat}
#stage.tw{--fanimg:url(img/minigame/fan/fan-twilight.webp)}
#stage.tw #flip{filter:sepia(0) hue-rotate(0deg) saturate(1.05) brightness(.86)}
#stage.tw .curt img{filter:sepia(0) hue-rotate(0deg) saturate(.9) brightness(.8)}
#bgNt{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-night.webp) 0 0/100% 100% no-repeat}
#bgN2{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-latenight.webp) 0 0/100% 100% no-repeat}
#bgN3{position:absolute;inset:0;z-index:0;opacity:0;background:url(img/bg/room-midnight.webp) 0 0/100% 100% no-repeat}
#stage.nt{--fanimg:url(img/minigame/fan/fan-night.webp)}
#stage.nt #flip{filter:sepia(0) hue-rotate(0deg) saturate(1.05) brightness(.78)}
#stage.nt .curt img{filter:sepia(0) hue-rotate(0deg) saturate(.9) brightness(.7)}
#tint{position:absolute;inset:0;pointer-events:none;z-index:2;transition:background 2.5s}
/* 레이스 커튼 (방 투시에 맞춰 문틀 윗선을 따라 잘라서 배치) */
.curt{position:absolute;pointer-events:none;z-index:3;clip-path:var(--clip)}
.curt .in{width:100%;height:100%;transform-origin:50% 0;animation:sway var(--d) ease-in-out infinite alternate;will-change:transform}
.curt img{display:block;width:100%;height:100%;opacity:.92;transition:filter 2.5s;filter:none}
/* 저녁 무렵엔 커튼에도 주황빛을 더 얹음 */
#stage.dusk1 .curt img{filter:sepia(.4) hue-rotate(-14deg) saturate(1.8) brightness(.97)}
#stage.dusk2 .curt img{filter:sepia(.55) hue-rotate(-26deg) saturate(2.2) brightness(.95)}
#cL{left:742px;top:95px;width:150px;height:575px;--d:6.5s;--d2:3.6s;--clip:polygon(-30px 58px,calc(100% + 30px) 22.7px,calc(100% + 30px) calc(100% + 40px),-30px calc(100% + 40px))}
#cR{left:1148px;top:20px;width:267px;height:730px;--d:8s;--d2:4.4s;--clip:polygon(-30px 65px,100% 14.4px,100% calc(100% + 40px),-30px calc(100% + 40px))}
#cR .in{animation-delay:-3s;animation-direction:alternate-reverse}
@keyframes sway{0%{transform:skewX(-1.3deg) scaleX(1)}50%{transform:skewX(.9deg) scaleX(1.025)}100%{transform:skewX(-.4deg) scaleX(.985)}}
.ui{position:absolute;z-index:999}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(91,70,54,.18)}
#top{left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.pill{padding:.55em .9em;border-radius:999px;display:flex;align-items:center;gap:.4em;white-space:nowrap}
/* 호감도 표시: 캐릭터마다 얼굴 배지와 색이 달라요 (--cc 테두리색 / --cb 바탕색 / --ci 글자색) */
#lovePill{--cc:#f48fb1;--cb:#ffe9f0;--ci:#b83b6b;background:var(--cb);color:var(--ci);padding:.28em .9em .28em .28em;gap:.35em;cursor:pointer;box-shadow:0 0 0 2px var(--cc) inset,0 2px 10px rgba(91,70,54,.18);transition:background .3s,box-shadow .3s,color .3s}
#faceB{width:34px;height:34px;flex:none;background:center/contain no-repeat}
#lovePill #love{font-size:15px;font-weight:800;min-width:1.4em}
/* 상태창: 캐릭터를 꾹 누르면 머리 위에 뜨고, 한 번 더 터치하면 사라져요 */
#stat,#hstat,#ustat{position:absolute;left:50%;bottom:100%;margin-bottom:18px;width:210px;padding:12px 16px;z-index:1;font-size:15px;background:var(--card);border-radius:20px;box-shadow:0 2px 10px rgba(91,70,54,.22);transform:translateX(-50%) scale(calc(.85*var(--z)));transform-origin:50% 100%;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#stat:after,#hstat:after,#ustat:after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--card)}
#stat .name,#hstat .name,#ustat .name{font-weight:700;margin-bottom:6px}
#hc.stat #hstat,#uc.stat #ustat,#char.stat #stat{opacity:1;transform:translateX(-50%) scale(var(--z))}
#hc.stat #hbub{margin-bottom:calc(190px*var(--z))}
#uc.stat #ubub{margin-bottom:calc(190px*var(--z))}
#char.stat #bubble{margin-bottom:calc(190px*var(--z))}
.row{display:flex;align-items:center;gap:6px;margin:7px 0}
.row span{width:3.2em;flex:none}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
#mood{margin-top:8px;font-weight:700}
#menu{left:50%;transform:translateX(-50%);width:min(calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),520px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
#menu button{border:0;background:rgba(255,255,255,.6);border-radius:14px;padding:9px 0 8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .12s,background .2s}
#menu button b{font-size:24px;line-height:1}
#menu button.off{opacity:.4}
#menu button:active{transform:scale(.93);background:#ffe7e0}
/* 캐릭터 */
#char{position:absolute;left:0;top:0;transform:translate(-50%,-100%);will-change:transform}
#char img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#body{position:relative}
#char img.f{position:absolute;left:0;top:0;visibility:hidden}
#char img.f.oc{position:static;visibility:visible}
#char.mouth img.oc,#char.blink img.oc{visibility:hidden}
#char.mouth:not(.blink) img.oo{visibility:visible}
#char.blink:not(.mouth) img.cc{visibility:visible}
#char.mouth.blink img.co{visibility:visible}
#char.hurt1 img.f:not(.h1),#char.hurt2 img.f:not(.h2){visibility:hidden}
#char.hurt1 img.h1,#char.hurt2 img.h2{visibility:visible}
#char img.f.h3{top:auto;bottom:0;visibility:visible;opacity:0;transition:opacity .1s linear}   /* 깜짝 그림은 항상 깔아 두고 투명도만 바꿔서, 원래 모습과 겹치며 스르륵 바뀌어요 */
#char.hurt3 img.f.h3{opacity:1;transition:opacity .1s linear}
#char.hurt3 img.f:not(.h3){visibility:hidden!important}   /* 놀란 그림이 뜨는 동안 원래 그림은 숨겨서, 윤곽이 두 겹으로 겹쳐 보이지 않아요 */
#char.hurt3 #bubble{margin-bottom:26px}   /* 놀란 그림은 위로 더 길고 반짝선이 있어서, 말풍선을 조금 더 위로 띄워요 */   /* 놀란 그림은 느낌표 때문에 위로 조금 더 길어서, 아래를 맞춰요 */
/* 노래할 땐 부끄러워서 얼굴이 서서히 빨개져요 (1.2초). 기존 그림 위에 붉은 기운만 곱해서, 눈 감고 입 뻐끔거리는 모습은 그대로예요 */
#shyL{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;mix-blend-mode:multiply;visibility:hidden;transition:opacity 1.2s ease-in-out,visibility 0s 1.2s}
#shyL img{position:absolute;left:0;top:0;width:100%;height:auto}
#char.blink #shyL img.b,#char:not(.blink) #shyL img.a{visibility:hidden}   /* 눈 감았을 땐 붉은 기운 그대로(a), 눈 떴을 땐 눈 자리를 뺀 것(b) → 눈이 안 빨개져요 */
#char.shy #shyL{opacity:1;visibility:visible;transition:opacity 1.2s ease-in-out}
#char.hurt1 #shyL,#char.hurt2 #shyL{opacity:0;transition:none}
#char.hurt3 #shyL{opacity:0;visibility:visible;transition:opacity .22s ease-out}   /* 깜짝 땐 붉은 기운도 같이 스르륵 */   /* 맞았을 땐 바로 사라져요 (그림 크기가 달라서) */
#char.talking img{animation:talk .34s ease-in-out infinite;transform-origin:50% 100%}
#flip{transition:transform .25s,filter 2.5s;filter:none}
/* 저녁 무렵엔 캐릭터에만 주황빛을 더 진하게 (말풍선은 제외) */
#stage.dusk1 #flip{filter:sepia(.3) hue-rotate(-12deg) saturate(1.5) brightness(.98)}
#stage.dusk2 #flip{filter:sepia(.45) hue-rotate(-24deg) saturate(1.8) brightness(.96)}
#body{transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}

@keyframes talk{0%,100%{transform:scale(1)}50%{transform:translateY(-3%) scale(1.02,.98)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.99,1.035)}}
@keyframes waddle{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-4%) rotate(0)}50%{transform:translateY(0) rotate(3deg)}75%{transform:translateY(-4%) rotate(0)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-14%) scale(.97,1.04)}}
#body.ouch{animation:ouch .45s ease-out 1}

/* 선풍기: 누르면 날개가 돌고, 켜진 동안 커튼이 더 크게 흔들려요 */
#fan{position:absolute;left:615px;top:396px;width:109px;height:109px;z-index:1;cursor:pointer;border-radius:50%}

#stage.fan #fanBlades{opacity:.92;transition:opacity .8s}

/* 밖 장면: 거실과 같은 시간대에 맞춰 그림이 바뀌어요 (13시 오후 / 17시 노을 / 18시~ 저녁·밤). 아래 그림은 켜 둬서 전환 때 깜빡이지 않아요 */
.obg{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;opacity:0;transition:opacity 2.5s,filter 2.5s;pointer-events:none}

#stage.nt #obNt{opacity:1}

#stage.mid #obNt{filter:brightness(.6) saturate(.9) hue-rotate(8deg)}
/* 밖 왼쪽 길(숲길): 낚시터·돌계단 길과 같은 시간대에 그림이 바뀌어요 (낮 / 16시 오후 / 17시 노을 / 18시 저녁(20시 해질녘까지 유지) / 21시~ 달밤, 23시·0~5시는 달밤을 더 어둡게) */

#world10>.bgi{transition:filter 2.5s,visibility 0s}
#world10 .obg{transition:opacity 2.5s,filter 2.5s,visibility 0s}

#stage.set #wdSet,#stage.eve #wdSet,#stage.tw #wdSet,#stage.nt #wdSet{opacity:1}
#stage.eve #wdEve,#stage.tw #wdEve,#stage.nt #wdEve{opacity:1}

#stage.nt #wdNt{opacity:1}
#stage.n23 #wdNt{filter:brightness(.82) saturate(.95)}
#stage.mid #wdNt{filter:brightness(.6) saturate(.9) hue-rotate(8deg)}

#stage.nt #wnNt{opacity:1}

#stage.eve #world11>.bgi,#stage.eve #wnSet,

#stage.nt #fSign{filter:brightness(.5) saturate(.85) hue-rotate(15deg)}

/* 하치와레 집 앞 정원: 시간대별 그림이 있어서 배경 필터는 끄고, 그림을 서서히 덮어 가며 바꿔요 (낮 그림은 img/bg/garden.webp) */
#world7 .bgi{filter:none!important}
/* 거실과 같은 시간에 바뀌어요: 17시 노을 / 18시 저녁(20시 황혼 때도 유지) / 21시 달밤 / 23시~5시 깊은 밤 */

#stage.nt #oSign{filter:brightness(.5) saturate(.85) hue-rotate(15deg)}
#stage.n23 #oSign{filter:brightness(.42) saturate(.85) hue-rotate(15deg)}
#stage.mid #oSign{filter:brightness(.3) saturate(.8) hue-rotate(18deg)}
/* 정원 표지판도 같은 필터를 써서 배경과 같이 바뀌어요 */
#gSign{transition:filter 2.5s}
#stage.pm #gSign{filter:sepia(.08) saturate(1.05) brightness(.98)}
#stage.set #gSign{filter:sepia(.3) saturate(1.15) brightness(.95) hue-rotate(-8deg)}

#world3>.bgi,#world7>.bgi{transition:filter 2.5s,visibility 0s}
#world3 .obg,#world7 .obg{transition:opacity 2.5s,filter 2.5s,visibility 0s}
#stage.pm #world3>.bgi,
#stage.set #world3>.bgi,#stage.set #obPm,
#stage.eve #world3>.bgi,#stage.eve #obPm,#stage.eve #obSet,
#stage.tw #world3>.bgi,#stage.tw #obPm,#stage.tw #obSet,#stage.tw #obEve,
#stage.nt #world3>.bgi,#stage.nt #obPm,#stage.nt #obSet,#stage.nt #obEve,#stage.nt #obTw,
#stage.set #world7>.bgi,
#stage.eve #world7>.bgi,#stage.eve #gSet,
#stage.tw #world7>.bgi,#stage.tw #gSet,
#stage.nt #world7>.bgi,#stage.nt #gSet,#stage.nt #gEve,
#stage.n23 #gNt,#stage.mid #gNt,#stage.n23 #gEve,#stage.mid #gEve,#stage.n23 #gSet,#stage.mid #gSet,#stage.n23 #world7>.bgi,#stage.mid #world7>.bgi{visibility:hidden;transition:opacity 2.5s,filter 2.5s,visibility 0s 2.6s}
/* 오른쪽 길 첫 장면(돌계단 길): 밖 장면과 같은 시간대에 그림이 바뀌어요 (16시 오후 황금빛 / 17시 노을 / 18시 저녁 / 20시 해질녘 / 21시~ 밤, 23시·0~5시는 밤 그림을 더 어둡게) */
#world8>.bgi{transition:filter 2.5s,visibility 0s}
#world8 .obg{transition:opacity 2.5s,filter 2.5s,visibility 0s}
#stage.pm4 #cvPm,#stage.set #cvPm,#stage.eve #cvPm,#stage.tw #cvPm,#stage.nt #cvPm{opacity:1}
#stage.set #cvSet,#stage.eve #cvSet,#stage.tw #cvSet,#stage.nt #cvSet{opacity:1}
#stage.eve #cvEve,#stage.tw #cvEve,#stage.nt #cvEve{opacity:1}
#stage.tw #cvTw,#stage.nt #cvTw{opacity:1}
#stage.nt #cvNt{opacity:1}
#stage.n23 #cvNt{filter:brightness(.82) saturate(.95)}

#stage.set #world8>.bgi,#stage.set #cvPm,
#stage.eve #world8>.bgi,#stage.eve #cvPm,#stage.eve #cvSet,
#stage.tw #world8>.bgi,#stage.tw #cvPm,#stage.tw #cvSet,#stage.tw #cvEve,

#world9>.bgi{transition:filter 2.5s,visibility 0s}

  cend:{w:1509,h:1042,el:$('#world9'),charW:150,hor:480,ref:1000,floor:{x0:360,x1:1100,y0:640,y1:1035},wander:[480,940]},   // 오른쪽 길 끝: 낚시터

  hill:{w:1509,h:1042,el:$('#world12'),charW:172,hor:400,ref:1000,floor:{x0:525,x1:1090,y0:740,y1:1035},wander:[560,950]},   // 숲 끝 오른쪽 길: 언덕 위 둥근 문 집

};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// 오른쪽 아래 테이블 앞쪽은 막아둠
function clampPt(x,y){
  if(curRoom==='outside'&&x<690&&y>=FLOOR.y0)y=Math.max(500,FLOOR.y0-(690-x)*.6);   // 왼쪽 아래(꽃밭)를 눌러도 x 690에서 멈추지 않고 왼쪽 길을 따라 올라가요
  if(curRoom==='outside'&&x<690&&y<FLOOR.y0){   // 밖 왼쪽 돌길: 가운데 길에서 왼쪽 위로 이어지는 길을 따라 걸어갈 수 있어요 (꽃밭·울타리는 막아둠)
    const L=[[500,100,190],[560,150,255],[600,205,305],[650,230,365],[700,265,410],[740,310,520],[790,440,690],[810,470,690]];

    const u=clamp((y-a[0])/(b[0]-a[0]),0,1);return{x:clamp(x,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u),y}
  }

  if(curRoom==='wend'){y=clamp(y,FLOOR.y0,FLOOR.y1);if(y<840&&x<1050)y=840;let L=y>=840?[[840,590,1200],[900,610,1170],[1000,650,1085],[1035,665,1065]]:[[620,1165,1235],[700,1150,1252],[780,1110,1255],[840,1000,1200]];let a=L[0],b=L[L.length-1];for(let i=1;i<L.length;i++)if(y<=L[i][0]){a=L[i-1];b=L[i];break}const u=clamp((y-a[0])/(b[0]-a[0]),0,1);return{x:clamp(x,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u),y}}   // 아래 넓은 길과 오른쪽 길로만 걸어요 (가운데 언덕·바위·풀숲은 막아둠)
  if(curRoom==='hill'){y=clamp(y,FLOOR.y0,FLOOR.y1);const L=[[740,596,702],[800,525,712],[850,535,750],[900,565,795],[950,605,905],[1000,655,1040],[1035,690,1090]];let a=L[0],b=L[L.length-1];for(let i=1;i<L.length;i++)if(y<=L[i][0]){a=L[i-1];b=L[i];break}const u=clamp((y-a[0])/(b[0]-a[0]),0,1);return{x:clamp(x,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u),y}}   // 돌계단 길로만 걸어요
  if(curRoom==='fish'){y=clamp(y,FLOOR.y0,FLOOR.y1);const t=(y-470)/95;return{x:clamp(x,620-100*t,930+80*t),y}}   // 부두 널빤지 위로만 걸어요
  if(curRoom==='cend'){y=clamp(y,FLOOR.y0,FLOOR.y1);if(y>=900){const t=clamp((y-900)/90,0,1);return{x:clamp(x,660-300*t,960+40*t),y}}const L=[[640,855,945],[660,825,945],[690,780,945],[720,735,945],[750,690,945],[780,665,925],[800,665,915],[815,665,920],[840,650,915],[870,650,920],[900,660,960]];let a=L[0],b=L[L.length-1];for(let i=1;i<L.length;i++)if(y<=L[i][0]){a=L[i-1];b=L[i];break}const u=clamp((y-a[0])/(b[0]-a[0]),0,1);return{x:clamp(x,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u),y}}   // 길 -> 풀밭 -> 부두 널빤지 위로 걸어요 (앞쪽 기둥 오른쪽·물 위는 막아둠)   // 왼쪽 접이식 의자·낚싯대 앞, 오른쪽 바위 앞은 막아둠
  if(curRoom==='garden'){y=clamp(y,FLOOR.y0,FLOOR.y1);const t=clamp((y-945)/85,0,1);return{x:clamp(x,420-40*t,700+120*t),y}}   // 대문 두 짝 사이로만 걸어요 (문짝 위로는 못 올라가요)

const SING_LOVE=80;   // 호감도가 이 값을 넘어야 노래를 불러요 (화면에 보이는 숫자 기준)

let singWarm=false;
function startSing(byPet){
  if(singWarm)return;
  if(byPet?!canSingPet():!canSing())return;
  if(BGM.layers.slice(1).every(a=>!a.paused)){doSing(byPet);return}   // 보조 음악이 이미 켜져 있으면 바로
  singWarm=true;
  try{SFX.sing.el.currentTime=0}catch(e){}   // 노래 소리도 미리 맨 앞으로 (재생 직전에 되감지 않게)
  bgmHelpersOn(()=>setTimeout(()=>{   // 음악 2개가 나오기 시작하고 자리를 잡은 뒤에 노래 시작 → 끊김 방지
    singWarm=false;bgmSync();

var ffReady=false;
const FF_N=16,FF_REG={outside:{x0:60,x1:1450,y0:540,y1:900},lake:{x0:60,x1:1450,y0:500,y1:830},garden:{x0:80,x1:1450,y0:520,y1:900}};
const FF={outside:[],lake:[],garden:[]};
let ffOn=false,ffLevel=0,ffLast=0,ffShown=false,ffSayCd=0;
const ffR=(a,b)=>a+Math.random()*(b-a);
function ffPlace(f,reg){f.bx=ffR(reg.x0,reg.x1);f.by=ffR(reg.y0,reg.y1)}
function ffFlee(f){
  if(f.state!==0||f.o<.2)return;
  f.state=1;f.t0=performance.now();f.vx=ffR(-380,380);f.vy=-ffR(260,520);f.sx=f.x;f.sy=f.y;
  const now=Date.now();
  if(now>ffSayCd&&Math.random()<.45&&!sleeping&&!moving&&!hEvt&&!singing&&!hSinging&&!bub.classList.contains('show')){
    ffSayCd=now+9000;const L=['앗! 도망갔다…','깜짝 놀랐나 봐~','쉿, 놀라지 않게 살살…','반짝반짝… 어디 갔지?'];say(L[Math.random()*L.length|0],2000)
  }
}
(function(){
  const W={outside:'world3',lake:'world5',garden:'world7'};
  for(const k in W){
    const box=document.createElement('div');box.className='ffc';document.getElementById(W[k]).appendChild(box);
    for(let i=0;i<FF_N;i++){
      const el=document.createElement('i');el.className='ffly';box.appendChild(el);
      const f={el,th:i/FF_N*.8,ax:ffR(30,90),ay:ffR(14,40),fx:ffR(.18,.42),fy:ffR(.25,.55),fx2:ffR(.5,.9),p1:ffR(0,6.28),p2:ffR(0,6.28),p3:ffR(0,6.28),fb:ffR(.9,1.6),pb:ffR(0,6.28),state:0,af:1,x:0,y:0,o:0,pe:false,t0:0,vx:0,vy:0,sx:0,sy:0,until:0};
      ffPlace(f,FF_REG[k]);
      el.addEventListener('pointerdown',()=>ffFlee(f));
      FF[k].push(f);
    }
  }
  ffReady=true;
})();
function ffFrame(ts){
  requestAnimationFrame(ffFrame);
  const dt=Math.min(.1,(ts-ffLast)/1000||0);ffLast=ts;
  ffLevel=Math.max(0,Math.min(1,ffLevel+(ffOn?dt/3.5:-dt/3.5)));
  const g=FF[curRoom];
  if(ffLevel<=0){
    if(ffShown){ffShown=false;for(const k in FF)FF[k].forEach(f=>{f.el.style.opacity=0;f.el.style.pointerEvents='none';f.pe=false;f.o=0})}
    return
  }
  if(!g||document.hidden)return;
  ffShown=true;
  const t=ts/1000,reg=FF_REG[curRoom];
  for(const f of g){
    let x,y,o,sc;
    if(f.af<1)f.af=Math.min(1,f.af+dt/1.8);
    if(f.state===0){
      x=f.bx+f.ax*Math.sin(t*f.fx+f.p1)+f.ax*.4*Math.sin(t*f.fx2+f.p3);y=f.by+f.ay*Math.sin(t*f.fy+f.p2);
      const b=.5+.5*Math.sin(t*f.fb+f.pb),inten=.12+.88*b*b*b;
      o=Math.max(0,Math.min(1,(ffLevel-f.th)/.2))*f.af*inten;sc=.7+.5*inten;f.x=x;f.y=y
    }else if(f.state===1){
      const e=(performance.now()-f.t0)/1000;
      x=f.sx+f.vx*e;y=f.sy+f.vy*e;o=Math.max(0,1-e/1.2);sc=1.2+e*.4;
      if(e>1.2){f.state=2;f.until=performance.now()+ffR(4500,8000);o=0}
    }else{
      o=0;x=f.x;y=f.y;sc=.7;
      if(performance.now()>f.until){ffPlace(f,reg);f.state=0;f.af=0}
    }
    f.o=o;
    const st=f.el.style;st.opacity=o.toFixed(3);st.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+sc.toFixed(2)+')';
    const pe=f.state===0&&o>.3;if(pe!==f.pe){f.pe=pe;st.pointerEvents=pe?'auto':'none'}
  }
}

// ---- 소리: 아이폰 화면녹화에 확실히 같이 녹음되도록 일반 <audio> 파일로 재생해요 ----
// (아이폰은 audio.volume을 무시해서, 볼륨과 페이드 인/아웃은 음원 파일 audio/bgm-s.mp3 · audio/hurt-s.mp3 · audio/hit1-s.mp3 · audio/sing1-s.mp3 에 미리 넣어뒀어요)
function mkAudio(u,loop){const a=new Audio();a.preload='auto';a.loop=!!loop;a.setAttribute('playsinline','');a.src=u;(window.ALLA=window.ALLA||[]).push(a);return a}
// 덕킹(노래할 때 음악 줄이기): 아이폰은 볼륨 조절이 안 돼서, 크기가 다른 음악 3개를 같이 틀어놓고 소리 나는 쪽만 바꿔 줘요 (음소거는 아이폰에서도 돼요)
const BGM={layers:[mkAudio('audio/bgm-s.mp3',true)],lvl:0,target:0,started:false};
BGM.el=BGM.layers[0];
const AMBD={el:mkAudio('audio/ambient-s.mp3',true)},AMBE={el:mkAudio('audio/ambient-eve-s.mp3',true)};   // 환경음: 노을(17시)~밤 11시 전은 새 자연 소리, 그 외 시간은 기존 소리
let AMB=(nowH()>=17&&nowH()<23)?AMBE.el:AMBD.el;
var ambReady=false;   // 환경음 준비 전(스크립트 앞부분 실행 중)에는 건드리지 않아요
function ambPick(){
  if(!ambReady)return;
  const h=nowH(),want=(h>=17&&h<23)?AMBE.el:AMBD.el;
  if(want===AMB)return;
  const old=AMB;AMB=want;try{old.pause()}catch(e){}
  if(BGM.started&&!appAway&&!document.hidden){try{AMB.muted=false;AMB.currentTime=0}catch(e){}tryPlay(AMB)}
}
ambReady=true;
//   // 배경음악 아래에 조용히 깔리는 환경음 (볼륨은 파일에 미리 넣어둠, 음악보다 약 7dB 작게)
// [테스트] 음악 1개 + Web Audio 볼륨(GainNode)으로 덕킹: 단계 0/1/2 = 100%/70%/45%
const BGMG=[1,.7,.45];let bgmCtx=null,bgmGain=null;
function bgmAudioInit(){if(bgmCtx)return;try{const AC=window.AudioContext||window.webkitAudioContext;bgmCtx=new AC();const src=bgmCtx.createMediaElementSource(BGM.el);bgmGain=bgmCtx.createGain();bgmGain.gain.value=BGMG[BGM.lvl];src.connect(bgmGain);bgmGain.connect(bgmCtx.destination)}catch(e){bgmCtx=null;bgmGain=null}}
// 선풍기·환경음도 같은 방식: 소리 파일들을 각각 볼륨 조절 장치(GainNode) 하나씩에 모아 연결해서, 음악과 같은 단계로 같이 줄여요
let busDone=false,fanGain=null,ambGain=null;
function busInit(){
  if(busDone||!bgmCtx)return;
  try{
    const fl=fanEls().map(d=>d.el),al=[AMBD.el,AMBE.el];
    fanGain=bgmCtx.createGain();ambGain=bgmCtx.createGain();
    fanGain.gain.value=ambGain.gain.value=BGMG[BGM.lvl];
    fanGain.connect(bgmCtx.destination);ambGain.connect(bgmCtx.destination);
    const route=(els,g)=>els.forEach(el=>{try{bgmCtx.createMediaElementSource(el).connect(g)}catch(e){}});
    route(fl,fanGain);route(al,ambGain);
    busDone=true;
  }catch(e){}
}
function bgmResume(){try{if(bgmCtx&&bgmCtx.state!=='running')bgmCtx.resume()}catch(e){}}
function bgmApply(){bgmAudioInit();busInit();bgmResume();[bgmGain,fanGain,ambGain].forEach(g=>{if(g)try{g.gain.setTargetAtTime(BGMG[BGM.lvl],bgmCtx.currentTime,.06)}catch(e){}})}
function bgmSync(){if(BGM.layers.length<2)return;   // 3개의 재생 위치를 맞춰 둬요 (소리 안 나는 쪽만 이동해서 끊김 없음)
  const t=BGM.layers[BGM.lvl].currentTime;
  BGM.layers.forEach((a,i)=>{
    if(i===BGM.lvl||a.paused||a.seeking)return;
    let d=a.currentTime-t;const du=a.duration;
    if(isFinite(du)&&du>1&&Math.abs(d)>du/2)d-=Math.sign(d)*du;   // 반복 구간 경계에서 헷갈리지 않게
    if(Math.abs(d)>.12){try{a.currentTime=t}catch(e){}}
  });
}
setInterval(()=>{if(!appAway&&!document.hidden&&BGM.started&&!BGM.stepping&&BGM.lvl===BGM.target)bgmSync()},4000);   // 노래 안 할 때 조용히 미리 맞춰 둬서, 바뀌는 순간엔 되감기가 필요 없어요
function bgmHelpersPause(){BGM.layers.slice(1).forEach(a=>{try{a.pause()}catch(e){}})}
function bgmStep(){
  if(BGM.stepping)return;
  if(BGM.lvl===BGM.target){return}
  BGM.stepping=true;
  BGM.lvl+=BGM.target>BGM.lvl?1:-1;bgmApply();
  setTimeout(()=>{BGM.stepping=false;bgmStep()},130);   // 130ms마다 한 단계씩 → 약 0.3초에 걸쳐 부드럽게 줄고 커져요
}
function bgmHelpersOn(cb){   // 보조 음악 2개를 지금 위치에 맞춰 켜고, 실제로 나오기 시작하면 cb 실행
  clearTimeout(BGM.hp);
  const base=BGM.layers[0],hs=BGM.layers.slice(1).filter(a=>a.paused);
  if(!hs.length){cb();return}
  let left=hs.length,fired=false;
  const go=()=>{if(fired)return;fired=true;cb()};
  hs.forEach(a=>{try{a.currentTime=base.currentTime}catch(e){}a.muted=true;a.addEventListener('playing',()=>{if(--left===0)go()},{once:true});tryPlay(a)});
  setTimeout(go,700);
}
const SFX={hurt:{el:mkAudio('audio/hurt-s.mp3')},hit:{el:mkAudio('audio/hit1-s.mp3')},sing:{el:mkAudio('audio/sing1-s.mp3')},hsing:{el:mkAudio('audio/hsing-s.mp3')},surp:{el:mkAudio('audio/surprise-s.mp3')},knockL:{el:mkAudio('audio/knock-s.mp3')},knockK:{el:mkAudio('audio/knock-k.mp3')},stepL:{el:mkAudio('audio/step-s.mp3')},stepK:{el:mkAudio('audio/step-k.mp3')},hCome:{el:mkAudio('audio/hachi-come-s.mp3')},hLive:{el:mkAudio('audio/hachi-live-s.mp3')},uHint:{el:mkAudio('audio/usagi-hint-s.mp3')},uArr:{el:mkAudio('audio/usagi-arrive-s.mp3')},cur:null};
const HSING_ENV='0100000011111100001100000110110000110011100000001111111000011011000000';   // 하치와레 노래("예예~ 타파스타!") 입 모양 (0.05초마다 1=벌림)
const SING_ENV='00000111111111110000001110011001110000000001111111111111100000000000011001100111100001111111100000000000011111111111011111010000000000011111000000001111100000000111111011100000011111101111100000011111111111000001000001100000011001110000000011100000';   // 노래 소리 크기에 맞춘 입 모양 (0.05초마다 1=벌림)
let appAway=false;
// ---- 선풍기 소리: 켜면 '딸깍+돌아가기 시작' → 계속 도는 소리, 끌 때는 서서히 작아지며 끝나요 (볼륨/페이드는 음원 파일에 미리 넣어둠) ----
// 아이폰은 <audio loop> 가 반복될 때마다 아주 짧게 끊겨요. 그래서 반복 대신, 같은 소리 2개를 번갈아 켜서
// 앞 소리가 서서히 줄어드는 동안(0.8초) 다음 소리가 서서히 커지며 겹치게 해서 끊김이 안 들리게 해요.
const FAN_O=0.8,FAN_L=10.59;   // 겹치는 길이(초) / 반복음에서 겹침 직전까지의 길이(초) — 음원 파일(audio/fan-loop2-s.mp3)에 맞춘 값
const FAN={intro:{el:mkAudio('audio/fan-intro2-s.mp3')},loops:[{el:mkAudio('audio/fan-loop2-s.mp3')},{el:mkAudio('audio/fan-loop2-s.mp3')}],cur:0,
  fo:[{el:mkAudio('audio/fan-fo1-s.mp3')},{el:mkAudio('audio/fan-fo2-s.mp3')},{el:mkAudio('audio/fan-fo3-s.mp3')}],phase:'off',iv:null,out:null};
function fanEls(){return [FAN.intro,...FAN.loops,...FAN.fo]}
function fanHalt(){clearInterval(FAN.iv);FAN.iv=null;fanEls().forEach(d=>{try{d.el.pause()}catch(e){}});FAN.out=null}
// next 소리가 실제로 나기 시작하는 순간 나머지 선풍기 소리를 모두 멈춰서, 소리 사이가 끊기지 않게 이어붙여요
function fanSwap(next){
  try{next.currentTime=0}catch(x){}
  let done=false,tm=null;
  const stopOthers=()=>{if(done)return;done=true;clearTimeout(tm);fanEls().forEach(d=>{if(d.el!==next){try{d.el.pause()}catch(x){}}})};
  next.addEventListener('playing',stopOthers,{once:true});
  tm=setTimeout(stopOthers,600);
  fxPlay(next);
}
function fanLoopTick(){   // 지금 도는 소리가 겹침 지점에 오면 다른 쪽 소리를 이어서 켜요
  if(FAN.phase!=='loop'){clearInterval(FAN.iv);FAN.iv=null;return}
  const c=FAN.loops[FAN.cur].el;
  if(c.ended||c.currentTime>=FAN_L){
    FAN.cur^=1;const n=FAN.loops[FAN.cur].el;try{n.currentTime=0}catch(e){}fxPlay(n);
  }
}
function fanLoopStart(){
  clearInterval(FAN.iv);FAN.phase='loop';FAN.cur=0;
  FAN.loops.forEach(d=>{try{d.el.pause()}catch(e){}});
  const e=FAN.loops[0].el;try{e.currentTime=0}catch(x){}fxPlay(e);
  FAN.iv=setInterval(fanLoopTick,30);
}
function fanSoundOn(){
  if(appAway||document.hidden)return;
  fanHalt();FAN.phase='intro';
  const i=FAN.intro.el;try{i.currentTime=0}catch(e){}fxPlay(i);
  FAN.iv=setInterval(()=>{   // 돌기 시작하는 소리가 끝나가면(끝이 서서히 줄어드는 동안) 계속 도는 소리를 겹쳐서 이어붙이기
    if(FAN.phase!=='intro'){clearInterval(FAN.iv);FAN.iv=null;return}
    const d=i.duration||4.545;
    if(i.ended||i.currentTime>=d-FAN_O)fanLoopStart();
  },30);
}
function fanSoundOff(){
  if(FAN.phase==='off'||FAN.phase==='out')return;
  const was=FAN.phase;let t=0;
  if(was==='intro')t=FAN.intro.el.currentTime;
  clearInterval(FAN.iv);FAN.iv=null;
  let n=-1;   // 끌 때 돌아가던 속도에 가까운 '서서히 작아지는' 소리를 골라요
  if(was==='loop'||t>=3.2)n=2;else if(t>=1.5)n=1;else if(t>=0.4)n=0;
  if(n<0||appAway||document.hidden){fanHalt();FAN.phase='off';return}
  FAN.phase='out';const e=FAN.fo[n].el;FAN.out=e;
  e.onended=()=>{if(FAN.out===e){FAN.phase='off';FAN.out=null}};
  fanSwap(e);   // 도는 소리를 먼저 끊지 않고, 줄어드는 소리가 시작되는 순간 바꿔서 끊김 없이
}
function bgmPlaying(){return !BGM.el.paused&&!appAway&&!document.hidden}
function bgmPlay(){bgmApply();bgmResume();BGM.layers.forEach(tryPlay);tryPlay(AMB)}
function tryPlay(a){try{const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function fxPlay(a){try{a.muted=false}catch(e){}tryPlay(a)}   // 효과음은 항상 소리를 켠 채로 재생
// 효과음 재생이 나중에 막히지 않도록, 처음 터치 때 한 번씩 소리 없이 재생해서 '잠금 해제'
function unlockList(){return [SFX.hurt,SFX.hit,SFX.sing,SFX.hsing,SFX.surp,SFX.knockL,SFX.knockK,SFX.stepL,SFX.stepK,SFX.hCome,SFX.hLive,SFX.uHint,SFX.uArr,...fanEls(),...[AMBD,AMBE].filter(d=>d.el!==AMB)]}
function sfxUnlock(){
  for(const d of unlockList()){
    if(d.ok||d.pend)continue;d.pend=true;
    const e=d.el;e.muted=true;
    // 혹시 소리가 새어 나가도 효과음의 '끝부분(거의 무음)'만 나가도록, 끝 쪽으로 옮겨 놓고 틀어요
    try{if(e.readyState>=1&&isFinite(e.duration)&&e.duration>.5)e.currentTime=Math.max(0,e.duration-.2)}catch(x){}

  mush:{ks:['mush'],ps:[[[220,600],[440,590],[470,680],[250,690]],[[670,560],[830,560],[790,640],[670,625]]]}   // 바위 옆·나무 그늘
};
const G_MAX=5,G_MIN=3*60e3,G_MAX_MS=15*60e3,gRand=()=>G_MIN+Math.random()*(G_MAX_MS-G_MIN);
function gIn(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function gPt(p){const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);for(let n=0;n<300;n++){const x=Math.round(x0+Math.random()*(x1-x0)),y=Math.round(y0+Math.random()*(y1-y0));if(gIn(x,y,p))return{x,y}}return{x:Math.round((p[0][0]+p[1][0]+p[2][0])/3),y:Math.round((p[0][1]+p[1][1]+p[2][1])/3)}}
function gSpawn(){
  const G=S.gather,cnt={};Object.keys(GZ).forEach(z=>cnt[z]=0);G.spots.forEach(s=>cnt[s.z]++);
  const mn=Math.min(...Object.values(cnt)),zs=Object.keys(GZ).filter(z=>cnt[z]===mn),z=zs[Math.random()*zs.length|0],Z=GZ[z];   // 가장 적게 반짝이는 구역부터 채워서 고르게 섞어요
  const p=gPt(Z.ps[Math.random()*Z.ps.length|0]);
  const k=Math.random()<.08?'rare':Z.ks[Math.random()*Z.ks.length|0],L=ING_IMG[k];   // 가끔(8%) 특별한 재료가 반짝여요
  G.spots.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),z,k,v:L[Math.random()*L.length|0],x:p.x,y:p.y});
}
function gTick(){
  const G=S.gather=S.gather||{spots:[],next:null,init:false},now=Date.now();let chg=false;
  if(!G.init){G.init=true;for(let i=0;i<3;i++)gSpawn();G.next=now+gRand();chg=true}   // 처음엔 3곳이 이미 반짝여요
  while(G.spots.length<G_MAX&&G.next&&G.next<=now){gSpawn();chg=true;G.next=G.spots.length<G_MAX?G.next+gRand():null}   // 게임을 꺼둔 동안 지난 시간만큼도 채워요
  if(G.spots.length>=G_MAX){if(G.next){G.next=null;chg=true}}
  else if(!G.next){G.next=now+gRand();chg=true}
  if(chg)save();gRender();
}
function gRender(){
  const box=$('#gSpots');if(!box)return;const G=S.gather,ids=new Set(G.spots.map(s=>s.id)),have=new Set();
  [...box.children].forEach(e=>{if(e.classList.contains('pick'))return;if(!ids.has(e.dataset.id))e.remove();else have.add(e.dataset.id)});
  G.spots.forEach(s=>{if(have.has(s.id))return;const b=document.createElement('button');b.className='hot gspot';b.dataset.id=s.id;b.style.left=s.x+'px';b.style.top=s.y+'px';b.innerHTML=ingIcon(s.k,s.v);if(s.k==='rare')b.classList.add('rare');b.addEventListener('click',()=>gGo(s.id));box.appendChild(b)});
}
function gGo(id){   // 반짝이는 곳을 누르면 바로 주워요
  if(sleeping||moving||hEvt||curRoom!=='wood')return;
  const s=S.gather.spots.find(q=>q.id===id);if(!s)return;
  midGo=null;arrivedSay=false;gPick(id);   // 걸어가지 않고 터치만 해도 바로 채집돼요
}
function gPick(id){
  const G=S.gather,i=G.spots.findIndex(q=>q.id===id);if(i<0)return;const s=G.spots[i],F=focusPt();
  if(G.spots.length>=G_MAX||!G.next)G.next=Date.now()+gRand();   // 다 차 있었다면 이때부터 3~15분 뒤에 새 자리
  G.spots.splice(i,1);gainIng(s.k);
  const el=$('#gSpots').querySelector('[data-id="'+id+'"]');
  if(el){el.classList.add('pick');el.style.left=F.x+'px';el.style.top=(F.y-70)+'px';setTimeout(()=>el.remove(),520)}
  const m=ING[s.k].e+' '+ING[s.k].n+'을(를) 주웠어!';
  if(ctrlH())hSay(m,1800);else say(m,1800);fx(ING[s.k].e);
}
$('#world10').insertAdjacentHTML('beforeend','<div id="gSpots" style="position:absolute;inset:0;pointer-events:none"></div>');
gTick();setInterval(gTick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)gTick()});
$('#cookBtn').addEventListener('click',cookOpen);
$('#cookBtn2').addEventListener('click',cookOpen);
</script>
